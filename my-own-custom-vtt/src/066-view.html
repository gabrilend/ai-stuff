<!doctype html>
<!--
  066-view.html -- the page the bridge hands over.

  Served from localhost by the bridge, to exactly one person. It holds no truth:
  everything on screen arrived from the server, which already decided what this
  particular person is allowed to know by not sending anything else.

  Deliberately one page with no dependencies. A view that fetches something from
  a network is a view that can be broken by a network, and this one is looking at
  a socket that is already the only thing it needs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>a table</title>
<style>
  html, body {
      margin: 0;
      padding: 0;
      background: #0b0b0d;
      color: #b8b0a4;
      font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
      overflow: hidden;
  }

  #board {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
  }

  #panel {
      position: fixed;
      top: 0;
      left: 0;
      padding: 10px 14px;
      background: rgba(11, 11, 13, 0.82);
      border-bottom-right-radius: 4px;
      pointer-events: none;
      white-space: pre;
  }

  /*
   * Refusals appear here, in words, where the person who pressed the key is
   * looking. Not in a console -- a refusal nobody sees is a silent drop with
   * extra steps.
   */
  #said {
      position: fixed;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: rgba(60, 20, 20, 0.9);
      color: #e8d8c8;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms;
      max-width: 70vw;
      text-align: center;
  }

  #said.showing { opacity: 1; }

  b { color: #d8cfc0; font-weight: 600; }
</style>
</head>
<body>
  <canvas id="board"></canvas>
  <div id="panel">connecting…</div>
  <div id="said"></div>

  <!--
    The opcode and slot table, generated by the bridge at startup from the C
    header rather than written here a second time. Two copies of a grammar
    drift, and the symptom is operands read at the wrong offsets -- which looks
    like corruption rather than like a mismatch.
  -->
  <script src="/tables.js"></script>
  <script src="/view.js"></script>
</body>
</html>
