<!doctype html>
<!--
  balance-history.html - shows how Warcraft III's stock numbers moved across versions

  Reads history.js (window.HISTORY), written beside it by src/cli/balance-history.lua,
  and draws: a searchable list of units, abilities, items and upgrades; one chart per
  number that changed, version by version; and a heat map of how many numbers each
  patch changed, by kind. Self-contained (no network); the data stays on this machine.
  Issue: issues/completed/115-balance-history-explorer.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance History</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #2a2622; --muted: #7a7166; --line: #ddd5c8;
    --accent: #7a4f2b; --accent2: #3f6f8f; --hot: #b2452f; --cold: #efe8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --panel: #25221e; --ink: #ece6dc; --muted: #9c9285; --line: #3a352f;
      --accent: #d8a15f; --accent2: #7fb3d5; --hot: #e0674b; --cold: #2c2823;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --panel: #25221e; --ink: #ece6dc; --muted: #9c9285; --line: #3a352f;
    --accent: #d8a15f; --accent2: #7fb3d5; --hot: #e0674b; --cold: #2c2823;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, "Iowan Old Style", serif; }
  header { padding: 18px 16px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  button, select, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  main { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; padding: 0 16px 24px; }
  main > section { min-width: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  #list { max-height: 72vh; overflow-y: auto; margin-top: 8px; }
  #list div { padding: 4px 6px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #list div:hover, #list div.sel { background: var(--cold); }
  #list .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #list .n { color: var(--muted); font-size: 12px; }
  #search { width: 100%; }
  h2 { font-size: 18px; margin: 4px 0 2px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 10px; }
  .chart { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .chart .t { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  svg { width: 100%; height: auto; display: block; }
  .tip { font-size: 12px; color: var(--muted); min-height: 1.2em; }
  #heat { overflow-x: auto; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .pobj { border-top: 1px solid var(--line); padding: 8px 2px; }
  .pobj h3 { font-size: 15px; margin: 0 0 4px; font-weight: normal; cursor: pointer; }
  .pobj h3 .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .pobj h3 .kind { color: var(--muted); font-size: 12px; }
  .prow { display: grid; grid-template-columns: minmax(160px, 1fr) auto auto; gap: 10px; font-size: 13px; padding: 1px 0; }
  .prow .f { font-family: ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .up { color: var(--accent2); } .down { color: var(--hot); }
  .counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0; }
  #heat rect.col { cursor: pointer; }
  .banner { border: 2px dashed var(--hot); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .banner b { color: var(--hot); }
  .banner a { color: var(--accent2); }
  .notes h3 { font-size: 15px; margin: 14px 0 4px; }
  .notes h4 { font-size: 14px; margin: 10px 0 2px; color: var(--muted); font-weight: normal; }
  .notes p { margin: 2px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Balance History</h1>
  <span class="sub" id="summary"></span>
  <div class="controls">
    <span id="games"></span>
    <select id="patch" title="See what one patch changed"></select>
    <select id="kind"><option value="">every kind</option><option>unit</option><option>ability</option><option>item</option><option>upgrade</option></select>
    <button id="theme" title="Switch light and dark">◐</button>
  </div>
</header>
<main>
  <section class="panel">
    <input id="search" placeholder="Search by name or id (hkni, Knight…)">
    <div id="list"></div>
  </section>
  <section>
    <div class="panel">
      <button id="back" style="float:right;display:none">← every patch</button>
      <h2 id="title">Which patches changed the most</h2>
      <div class="sub" id="subtitle">Numbers changed from the version before, by kind of object. Pick an object on the left to see its history.</div>
      <div id="heat"></div>
      <div id="detail" class="charts"></div>
    </div>
  </section>
</main>
<script src="history.js"></script>
<script src="notes.js"></script>
<script>
(function () {
  "use strict";
  var H = window.HISTORY;
  if (!H) { document.body.textContent = "history.js is missing: run scripts/balance-history.sh"; return; }
  var NOTES = window.NOTES || {};
  var state = { game: H.games.tft ? "tft" : Object.keys(H.games)[0], kind: "", sel: null, patch: null, notes: null };
  // {{{ versions in order, including notes-only ones
  // "1.21b" is 1, 21, 2, 0; "1.29.2" is 1, 29, 0, 2 (as the project's chain orders them).
  function vkey(v) {
    var m = /^(\d+)\.(\d+)([a-z]?)\.?(\d*)$/.exec(v) || [0, 0, 0, "", 0];
    return [+m[1], +m[2], m[3] ? m[3].charCodeAt(0) - 96 : 0, +(m[4] || 0)];
  }
  function vless(a, b) { var x = vkey(a), y = vkey(b); for (var i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] < y[i]; return false; }
  // Every column for a game: its data versions (read from the game's own
  // files) and the notes-only versions it doesn't read, in version order.
  function columns(game) {
    var g = H.games[game], cols = g.versions.map(function (v, i) { return { v: v, data: i }; });
    // A notes page named for a version family the game's data already has
    // ("Patch 1.14" beside the 1.14b layer) is that same patch: not repeated.
    var family = {};
    g.versions.forEach(function (v) { family[v.replace(/[a-z]$/, "")] = true; });
    Object.keys(NOTES).forEach(function (v) {
      if (g.versions.indexOf(v) >= 0) return;
      if (!/[a-z]$/.test(v) && family[v]) return;
      cols.push({ v: v, notes: true });
    });
    cols.sort(function (a, b) { return vless(a.v, b.v) ? -1 : vless(b.v, a.v) ? 1 : 0; });
    return cols;
  }
  var NOT_SUPPORTED = "not supported by this project — patch notes only";
  // }}}
  // An address opens a game and an object (#tft/hkni) or a patch (#tft/v/1.22a).
  var hash = location.hash.replace(/^#/, "").split("/");
  if (hash[0] && H.games[hash[0]]) state.game = hash[0];
  if (hash[1] === "v" && hash[2]) { var pi = H.games[state.game].versions.indexOf(hash[2]); if (pi > 0) state.patch = pi; }
  else if (hash[1] === "n" && hash[2] && NOTES[hash[2]]) state.notes = hash[2];
  else if (hash[1] && H.games[state.game].objects[hash[1]]) state.sel = hash[1];
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  // {{{ theme (remembered per viewer when storage is allowed)
  try { var saved = localStorage.getItem("bh-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
  $("theme").onclick = function () {
    var dark = document.documentElement.dataset.theme === "dark" ||
      (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("bh-theme", document.documentElement.dataset.theme); } catch (e) {}
    render();
  };
  // }}}

  // {{{ game buttons
  Object.keys(H.games).forEach(function (key) {
    var b = document.createElement("button");
    b.textContent = H.games[key].title;
    b.onclick = function () { state.game = key; state.sel = null; state.patch = null; state.notes = null; render(); };
    b.dataset.key = key;
    $("games").appendChild(b);
  });
  $("kind").onchange = function () { state.kind = this.value; render(); };
  $("patch").onchange = function () {
    var v = this.value; state.sel = null; state.patch = null; state.notes = null;
    if (v.indexOf("n:") === 0) state.notes = v.slice(2); else if (+v > 0) state.patch = +v;
    render();
  };
  $("search").oninput = function () { renderList(); if (state.patch) renderPatch(); };
  // }}}

  // {{{ changes: how many numbers each version changed, per kind
  function changes(game) {
    var g = H.games[game], n = g.versions.length, out = {};
    ["unit", "ability", "item", "upgrade"].forEach(function (k) { out[k] = new Array(n).fill(0); });
    Object.keys(g.objects).forEach(function (id) {
      var o = g.objects[id];
      Object.keys(o.fields).forEach(function (f) {
        var v = o.fields[f];
        for (var i = 1; i < n; i++) {
          if (v[i] !== null && v[i - 1] !== null && v[i] !== v[i - 1]) out[o.kind][i]++;
        }
      });
    });
    return out;
  }
  // }}}

  // {{{ heat map
  // One column per version in order; versions the project doesn't read are
  // hatched, labelled as not supported, and open their patch notes.
  function renderHeat() {
    var g = H.games[state.game], c = changes(state.game), kinds = ["unit", "ability", "item", "upgrade"];
    var cols = columns(state.game), n = cols.length, cw = 30, ch = 26, left = 70, top = 8;
    var max = 1;
    kinds.forEach(function (k) { c[k].forEach(function (x) { if (x > max) max = x; }); });
    var box = $("heat"); box.innerHTML = "";
    var svg = el("svg", { viewBox: "0 0 " + (left + n * cw + 10) + " " + (top + kinds.length * ch + 70), style: "min-width:" + (left + n * cw) + "px" }, box);
    var hot = css("--hot"), cold = css("--cold"), ink = css("--ink"), muted = css("--muted"), line = css("--line");
    var defs = el("defs", {}, svg);
    var pat = el("pattern", { id: "hatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("rect", { width: 6, height: 6, fill: cold }, pat);
    el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: line, "stroke-width": 3 }, pat);
    kinds.forEach(function (k, r) {
      el("text", { x: left - 8, y: top + r * ch + 17, "text-anchor": "end", fill: muted, "font-size": 12 }, svg).textContent = k;
      cols.forEach(function (col, ci) {
        var x = left + ci * cw + 1, y = top + r * ch + 1;
        if (col.notes) {
          el("rect", { x: x, y: y, width: cw - 2, height: ch - 2, rx: 3, fill: "url(#hatch)" }, svg);
          return;
        }
        var v = c[k][col.data], a = col.data === 0 ? 0 : Math.sqrt(v / max);
        var rect = el("rect", { x: x, y: y, width: cw - 2, height: ch - 2, rx: 3, fill: a > 0 ? hot : cold, "fill-opacity": a > 0 ? (0.15 + 0.85 * a) : 1 }, svg);
        el("title", {}, rect).textContent = col.v + ": " + v + " " + k + " numbers changed";
      });
    });
    cols.forEach(function (col, ci) {
      if (!col.notes && col.data === 0) return;
      var hit = el("rect", { x: left + ci * cw, y: top, width: cw, height: kinds.length * ch, fill: "transparent", "class": "col" }, svg);
      el("title", {}, hit).textContent = col.notes ? col.v + ": " + NOT_SUPPORTED : "What " + col.v + " changed";
      hit.onclick = function () {
        state.sel = null; state.patch = null; state.notes = null;
        if (col.notes) state.notes = col.v; else state.patch = col.data;
        render();
      };
    });
    cols.forEach(function (col, ci) {
      var tx = el("text", { x: left + ci * cw + cw / 2, y: top + kinds.length * ch + 14, fill: col.notes ? muted : ink, "font-size": 11,
        "font-style": col.notes ? "italic" : "normal",
        transform: "rotate(-55 " + (left + ci * cw + cw / 2) + " " + (top + kinds.length * ch + 14) + ")", "text-anchor": "end" }, svg);
      tx.textContent = col.v + (col.notes ? " *" : "");
    });
    var legend = document.createElement("div"); legend.className = "legend";
    legend.textContent = "Hatched columns marked * are versions this project doesn't read: " + NOT_SUPPORTED + " (from Liquipedia, CC BY-SA 3.0). Click any column.";
    box.appendChild(legend);
  }
  // }}}

  // {{{ list
  function renderList() {
    var g = H.games[state.game], q = $("search").value.toLowerCase();
    var ids = Object.keys(g.objects).filter(function (id) {
      var o = g.objects[id];
      if (state.kind && o.kind !== state.kind) return false;
      return !q || id.toLowerCase().indexOf(q) >= 0 || (o.name || "").toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return Object.keys(g.objects[b].fields).length - Object.keys(g.objects[a].fields).length; });
    var list = $("list"); list.innerHTML = "";
    ids.slice(0, 400).forEach(function (id) {
      var o = g.objects[id], d = document.createElement("div");
      d.innerHTML = "<span></span><span class='n'></span>";
      d.firstChild.textContent = (o.name || id) + " ";
      var s = document.createElement("span"); s.className = "id"; s.textContent = id; d.firstChild.appendChild(s);
      d.lastChild.textContent = Object.keys(o.fields).length;
      if (id === state.sel) d.className = "sel";
      d.onclick = function () { state.sel = id; render(); };
      list.appendChild(d);
    });
  }
  // }}}

  // {{{ one chart per changed field
  function chart(parent, g, field, values) {
    var box = document.createElement("div"); box.className = "chart"; parent.appendChild(box);
    var t = document.createElement("div"); t.className = "t"; t.textContent = field; box.appendChild(t);
    var W = 320, Hh = 130, pl = 42, pr = 8, pt = 10, pb = 24, n = g.versions.length;
    var nums = values.filter(function (v) { return v !== null; });
    var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
    if (lo === hi) { lo -= 1; hi += 1; }
    var pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    var X = function (i) { return pl + (W - pl - pr) * (n === 1 ? 0.5 : i / (n - 1)); };
    var Y = function (v) { return pt + (Hh - pt - pb) * (1 - (v - lo) / (hi - lo)); };
    var svg = el("svg", { viewBox: "0 0 " + W + " " + Hh }, box);
    var line = css("--line"), muted = css("--muted"), acc = css("--accent"), acc2 = css("--accent2");
    el("line", { x1: pl, y1: Hh - pb, x2: W - pr, y2: Hh - pb, stroke: line }, svg);
    [lo + pad, hi - pad].forEach(function (v) {
      el("text", { x: pl - 5, y: Y(v) + 4, "text-anchor": "end", fill: muted, "font-size": 10 }, svg).textContent = +v.toFixed(3);
      el("line", { x1: pl, y1: Y(v), x2: W - pr, y2: Y(v), stroke: line, "stroke-dasharray": "2 3" }, svg);
    });
    [0, n - 1].forEach(function (i) {
      el("text", { x: X(i), y: Hh - 8, "text-anchor": i === 0 ? "start" : "end", fill: muted, "font-size": 10 }, svg).textContent = g.versions[i];
    });
    var d = "", pen = false;
    values.forEach(function (v, i) {
      if (v === null) { pen = false; return; }
      d += (pen ? " H" + X(i) + " V" + Y(v) : " M" + X(i) + " " + Y(v)); pen = true;
    });
    el("path", { d: d, fill: "none", stroke: acc, "stroke-width": 2 }, svg);
    var tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip);
    values.forEach(function (v, i) {
      if (v === null) return;
      var changed = i > 0 && values[i - 1] !== null && values[i - 1] !== v;
      var c = el("circle", { cx: X(i), cy: Y(v), r: changed ? 4 : 2.2, fill: changed ? acc2 : acc }, svg);
      c.onmouseenter = function () { tip.textContent = g.versions[i] + ": " + v + (changed ? "  (was " + values[i - 1] + ")" : ""); };
    });
  }
  // {{{ what one patch changed
  function fmt(v) { return v === null || v === undefined ? "—" : String(+(+v).toFixed(4)); }
  function renderPatch() {
    var g = H.games[state.game], i = state.patch, det = $("detail"), q = $("search").value.toLowerCase();
    det.className = ""; det.innerHTML = ""; $("heat").innerHTML = "";
    $("title").textContent = "What " + g.versions[i] + " changed";
    $("subtitle").textContent = g.title + " " + g.versions[i - 1] + " → " + g.versions[i] +
      " · every number that differs, read from the game's own tables · click an object for its history";
    var groups = [], counts = { unit: 0, ability: 0, item: 0, upgrade: 0 };
    Object.keys(g.objects).forEach(function (id) {
      var o = g.objects[id];
      if (state.kind && o.kind !== state.kind) return;
      if (q && id.toLowerCase().indexOf(q) < 0 && (o.name || "").toLowerCase().indexOf(q) < 0) return;
      var rows = [];
      Object.keys(o.fields).sort().forEach(function (f) {
        var a = o.fields[f][i - 1], b = o.fields[f][i];
        if (a !== b && !(a === null && b === null)) rows.push({ f: f, a: a, b: b });
      });
      if (rows.length) { groups.push({ id: id, o: o, rows: rows }); counts[o.kind] += rows.length; }
    });
    groups.sort(function (x, y) { return x.o.kind === y.o.kind ? (x.o.name || x.id).localeCompare(y.o.name || y.id) : x.o.kind.localeCompare(y.o.kind); });
    var c = document.createElement("div"); c.className = "counts";
    c.textContent = groups.length + " objects · " + Object.keys(counts).map(function (k) { return counts[k] + " " + k + " numbers"; }).join(" · ");
    det.appendChild(c);
    if (!groups.length) { var none = document.createElement("div"); none.className = "sub"; none.textContent = "No numbers changed here (for this filter)."; det.appendChild(none); }
    groups.forEach(function (gr) {
      var box = document.createElement("div"); box.className = "pobj";
      var h = document.createElement("h3");
      h.appendChild(document.createTextNode((gr.o.name || gr.id) + " "));
      var sid = document.createElement("span"); sid.className = "id"; sid.textContent = gr.id + " "; h.appendChild(sid);
      var sk = document.createElement("span"); sk.className = "kind"; sk.textContent = gr.o.kind; h.appendChild(sk);
      h.onclick = function () { state.sel = gr.id; state.patch = null; render(); };
      box.appendChild(h);
      gr.rows.forEach(function (r) {
        var row = document.createElement("div"); row.className = "prow";
        var f = document.createElement("span"); f.className = "f"; f.textContent = r.f; row.appendChild(f);
        var ch = document.createElement("span");
        ch.textContent = r.a === null ? "new: " + fmt(r.b) : r.b === null ? "removed (was " + fmt(r.a) + ")" : fmt(r.a) + " → " + fmt(r.b);
        row.appendChild(ch);
        var d = document.createElement("span");
        if (r.a !== null && r.b !== null) { var diff = r.b - r.a; d.textContent = (diff > 0 ? "+" : "") + fmt(diff); d.className = diff > 0 ? "up" : "down"; }
        row.appendChild(d);
        box.appendChild(row);
      });
      det.appendChild(box);
    });
  }
  // }}}

  // {{{ notes-only versions
  function renderNotes() {
    var v = state.notes, n = NOTES[v], det = $("detail");
    det.className = "notes"; det.innerHTML = ""; $("heat").innerHTML = "";
    $("title").textContent = v + " — patch notes";
    $("subtitle").textContent = (n.release ? "released " + n.release : "") + (n.build ? " · build " + n.build : "");
    var later = vless("1.29.2", v);
    var banner = document.createElement("div"); banner.className = "banner";
    banner.innerHTML = "<b>Not supported by this project — patch notes only.</b> ";
    banner.appendChild(document.createTextNode(later
      ? "This is a later version that this project leaves alone on principle (it reads 1.07 to 1.29.2; see docs/versions-we-leave-alone.md). "
      : "No patch program for this version was found, so the project doesn't read its tables. "));
    banner.appendChild(document.createTextNode("These are the patch notes as published, not the game's own numbers, and they aren't on the charts. Text from "));
    var a = document.createElement("a"); a.href = n.url; a.textContent = n.title + " on Liquipedia"; a.target = "_blank"; a.rel = "noopener"; banner.appendChild(a);
    banner.appendChild(document.createTextNode(" (" + n.license + "), fetched " + n.fetched.slice(0, 10) + "."));
    det.appendChild(banner);
    n.sections.forEach(function (sec) {
      if (sec.heading) { var h = document.createElement(sec.level <= 2 ? "h3" : "h4"); h.textContent = sec.heading; det.appendChild(h); }
      sec.lines.forEach(function (l) {
        var p = document.createElement("p"); p.style.paddingLeft = (l[0] * 16) + "px";
        p.textContent = (l[0] > 0 ? "• " : "") + l[1]; det.appendChild(p);
      });
    });
  }
  // }}}

  function renderDetail() {
    var g = H.games[state.game], det = $("detail"); det.innerHTML = ""; det.className = "charts";
    if (state.notes && NOTES[state.notes]) { $("back").style.display = ""; $("back").onclick = function () { state.notes = null; render(); }; renderNotes(); return; }
    if (state.patch) { $("back").style.display = ""; $("back").onclick = function () { state.patch = null; render(); }; renderPatch(); return; }
    $("back").style.display = state.sel ? "" : "none";
    $("back").onclick = function () { state.sel = null; location.hash = state.game; render(); };
    if (!state.sel || !g.objects[state.sel]) {
      $("title").textContent = "Which patches changed the most";
      $("subtitle").textContent = "Numbers changed from the version before, by kind of object. Pick an object on the left to see its history.";
      renderHeat(); return;
    }
    var o = g.objects[state.sel];
    $("heat").innerHTML = "";
    $("title").textContent = (o.name || state.sel) + " (" + state.sel + ")";
    $("subtitle").textContent = o.kind + " · " + Object.keys(o.fields).length + " numbers changed across " + g.title + " " + g.versions[0] + "–" + g.versions[g.versions.length - 1] + " · hover a point; larger points mark a change";
    Object.keys(o.fields).sort().forEach(function (f) { chart(det, g, f, o.fields[f]); });
  }
  // }}}

  function render() {
    var g = H.games[state.game], count = Object.keys(g.objects).length;
    $("summary").textContent = g.title + ": " + g.versions.length + " versions, " + count + " objects whose numbers changed";
    Array.prototype.forEach.call($("games").children, function (b) { b.className = b.dataset.key === state.game ? "on" : ""; });
    var ps = $("patch"); ps.innerHTML = "";
    var o0 = document.createElement("option"); o0.value = 0; o0.textContent = "every patch (heat map)"; ps.appendChild(o0);
    columns(state.game).forEach(function (col) {
      if (!col.notes && col.data === 0) return;
      var o = document.createElement("option");
      if (col.notes) { o.value = "n:" + col.v; o.textContent = col.v + " — " + NOT_SUPPORTED; }
      else { o.value = col.data; o.textContent = "what " + col.v + " changed"; }
      ps.appendChild(o);
    });
    ps.value = state.notes ? "n:" + state.notes : (state.patch || 0);
    renderList(); renderDetail();
  }
  render();
})();
</script>
