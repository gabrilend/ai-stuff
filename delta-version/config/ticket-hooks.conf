# ticket-hooks.conf - what the ticket post-commit hook does (issue 022).
#
# The hook is opt-in twice over: nothing happens until you run
# scripts/install-ticket-hook.sh yourself, and even then it only previews.
# When a commit adds or changes a template in delta-version/templates/tickets/,
# the hook runs distribute-ticket.lua as a dry run for that template's targets
# below and prints the command that would file it.
#
# write = off   preview only (the default; leave it off unless you are sure)
# write = on    the hook files the tickets itself, with --write
write = off

# Optional: where written tickets are recorded (default: assets/ticket-distributions.tsv)
# ledger = /path/to/ticket-distributions.tsv

# One line per template that the hook should act on:
#   <template file name> = <distribute-ticket.lua targets and options>
# Allowed options: --projects --profile --language --uses --state --has
# --active-days --only --exclude --phase --slug --error-mode --create-issues.
# Values may hold letters, digits and , . _ - only. A template with no line
# here is named in the hook's output and otherwise left alone.
#
# readme-run-instructions.md = --phase=current --language=lua,c
