# project-discovery.conf - named filter sets for discover-projects.lua
#
# Each [profile] picks the projects one kind of ticket should go to. Keys:
#   description  shown by --list-profiles
#   language     dominant language is one of these (comma-separated)
#   uses         project tracks at least one file in one of these languages
#   state        census state: tracked, building, vision, empty
#   has          the project holds this path (comma-separated: all must exist)
#   active-days  a tracked file in it changed in the last N days
#   only         only these projects (names as the census gives them)
#   exclude      never these projects
# Options on the command line are applied on top of the profile.

[code-style-lua]
description = projects written mainly in Lua, for Lua style tickets
language = lua
state = tracked, building

[code-style-c]
description = projects written mainly in C, for C style tickets
language = c
state = tracked, building

[shell-scripts]
description = projects with any Bash script, for script-convention tickets
uses = bash
state = tracked, building

[build-system]
description = projects with a Makefile, for build tickets
has = Makefile

[organization]
description = every project that keeps issue files, for workflow tickets
state = tracked

[active]
description = tracked or building projects changed in the last 30 days
state = tracked, building
active-days = 30
