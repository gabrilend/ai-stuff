# Delta-Version Transcript-Summary Repositories Configuration
# File: config/transcript-summary-repos.conf
#
# Controls which repositories the transcript-summary overseer
# (scripts/summarize-overseer.sh) will scan for un-summarized Claude Code
# sessions. The authoritative list of sessions comes from ~/.claude/projects/;
# this file decides which of those projects are in scope.
#
# Created as part of Issue 056: Recursive Transcript Summarization.
# Seeded 2026-07-06 from the projects present in ~/.claude/projects/.

[settings]
# include_all_ai_stuff: automatically include every repository under the
#   ai-stuff root, so new ai-stuff projects are covered without editing this
#   file. When true, the [extra_repos] list only needs the OUTSIDE-ai-stuff
#   repositories.
# ai_stuff_root: the monorepo root that include_all_ai_stuff walks.
# claude_projects_dir: where the raw session logs live (the source of truth
#   for which sessions exist). The overseer reads each session's own "cwd"
#   field to map it back to its repository, because the dashed directory names
#   are ambiguous (both "." and "/" encode to "-").
include_all_ai_stuff=true
ai_stuff_root=/mnt/mtwo/programming/ai-stuff
claude_projects_dir=/home/ritz/.claude/projects

[extra_repos]
# Repositories OUTSIDE the ai-stuff root to also summarize.
# Format: absolute_path (one per line). Lines starting with "#" are ignored.
# Seeded from the non-ai-stuff projects found in ~/.claude/projects/. Comment
# out any you do not want summarized.
/mnt/mtwo/.dominions6
/mnt/mtwo/games/azeroth-core/wow-chat-2026
/mnt/mtwo/programs/r-mail
/mnt/mtwo/programs/risc-v-ollama
/mnt/mtwo/programs/sora/narrative-engine
/mnt/mtwo/programs/sora/soramech
/mnt/mtwo/scripts

[inference]
# Where the llama.cpp chat server lives. These mirror
# words-pdf/libs/inference-server-config.lua and can be overridden at run time
# by the INFERENCE_CHAT_HOST environment variable (replaces host:port).
# The server is started with words-pdf/scripts/start-llamacpp-server.sh.
chat_host=192.168.1.100
chat_port=20166
model_alias=Qwen3-8B
context_size=16384
