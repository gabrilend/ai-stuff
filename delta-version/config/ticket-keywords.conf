# Delta-Version Keyword Markup Language Configuration
# Specification: docs/keyword-markup-language-spec.md
# Version: 1.0
#
# This configuration defines keywords available for dynamic ticket templates.
# Keywords are processed by the KML engine (Issue 017) and replaced with
# command output when templates are instantiated.

[metadata]
# Processor configuration
version=1.0
error_mode=placeholder
timeout=10

[data_keywords]
# Simple data retrieval keywords (no parameters)
# These gather basic project information

# Project identification
project_name=basename "$(pwd)"
project_path=pwd
parent_dir=basename "$(dirname "$(pwd)")"

# Date and time
current_date=date '+%Y-%m-%d'
current_time=date '+%H:%M:%S'
current_datetime=date '+%Y-%m-%d %H:%M:%S'
current_year=date '+%Y'
current_month=date '+%m'

# User and environment
current_user=whoami
hostname=hostname -s 2>/dev/null || hostname

# Git information
git_branch=git branch --show-current 2>/dev/null || echo 'none'
git_remote=git remote get-url origin 2>/dev/null || echo 'none'
git_hash=git rev-parse --short HEAD 2>/dev/null || echo 'none'
git_hash_full=git rev-parse HEAD 2>/dev/null || echo 'none'
last_commit_date=git log -1 --format='%ci' 2>/dev/null | cut -d' ' -f1 || echo 'unknown'
last_commit_msg=git log -1 --format='%s' 2>/dev/null || echo 'none'
last_commit_author=git log -1 --format='%an' 2>/dev/null || echo 'unknown'

# Project structure detection
has_src=test -d ./src && echo 'yes' || echo 'no'
has_issues=test -d ./issues && echo 'yes' || echo 'no'
has_docs=test -d ./docs && echo 'yes' || echo 'no'
has_libs=test -d ./libs && echo 'yes' || echo 'no'

# Language detection (primary language based on file count)
primary_language=find . -type f \( -name '*.lua' -o -name '*.c' -o -name '*.rs' -o -name '*.py' -o -name '*.js' \) 2>/dev/null | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' || echo 'unknown'

[statistics_keywords]
# Computed metrics about the project (no parameters)

# File counts
file_count=find . -type f 2>/dev/null | wc -l | tr -d ' '
dir_count=find . -type d 2>/dev/null | wc -l | tr -d ' '
src_files=find ./src -type f 2>/dev/null | wc -l | tr -d ' '
doc_files=find ./docs -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' '

# Issue counts
issue_count=find ./issues -maxdepth 1 -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' '
completed_issues=find ./issues/completed -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' '
pending_issues=find ./issues -maxdepth 1 -name '[0-9]*.md' -type f 2>/dev/null | wc -l | tr -d ' '

# Size metrics
size_total=du -sh . 2>/dev/null | cut -f1 || echo 'unknown'
size_src=du -sh ./src 2>/dev/null | cut -f1 || echo '0'
size_docs=du -sh ./docs 2>/dev/null | cut -f1 || echo '0'

# Git statistics
commit_count=git rev-list --count HEAD 2>/dev/null || echo '0'
contributor_count=git shortlog -sn 2>/dev/null | wc -l | tr -d ' ' || echo '0'
branch_count=git branch -a 2>/dev/null | wc -l | tr -d ' ' || echo '0'

# Language-specific counts
lua_files=find . -name '*.lua' -type f 2>/dev/null | wc -l | tr -d ' '
c_files=find . \( -name '*.c' -o -name '*.h' \) -type f 2>/dev/null | wc -l | tr -d ' '
rust_files=find . -name '*.rs' -type f 2>/dev/null | wc -l | tr -d ' '
python_files=find . -name '*.py' -type f 2>/dev/null | wc -l | tr -d ' '
markdown_files=find . -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' '
shell_files=find . -name '*.sh' -type f 2>/dev/null | wc -l | tr -d ' '

# Code metrics (lines)
total_lines=find . -type f \( -name '*.lua' -o -name '*.c' -o -name '*.h' -o -name '*.rs' -o -name '*.py' \) -exec cat {} + 2>/dev/null | wc -l | tr -d ' '
lua_lines=find . -name '*.lua' -exec cat {} + 2>/dev/null | wc -l | tr -d ' '
c_lines=find . \( -name '*.c' -o -name '*.h' \) -exec cat {} + 2>/dev/null | wc -l | tr -d ' '

[analysis_keywords]
# Keywords that accept parameters for customized queries
# Use PARAM1, PARAM2, etc. for parameter substitution

# Function/pattern search
# Usage: ][function_usage[function_name,extension][]
function_usage=grep -r 'PARAM1' --include='*.PARAM2' ./src/ 2>/dev/null | wc -l | tr -d ' ' || echo '0'

# General pattern search with limit
# Usage: ][file_search[pattern,directory,limit][]
file_search=grep -rn 'PARAM1' ./PARAM2 2>/dev/null | head -PARAM3

# Count pattern occurrences
# Usage: ][grep_count[pattern,extension][]
grep_count=grep -r 'PARAM1' --include='*.PARAM2' . 2>/dev/null | wc -l | tr -d ' ' || echo '0'

# List files with extension in directory
# Usage: ][file_list[extension,directory][]
file_list=find ./PARAM2 -name '*.PARAM1' -type f 2>/dev/null | head -20 | xargs -I{} basename {} | tr '\n' ', ' | sed 's/, $//'

# Recent files (modified in last N days)
# Usage: ][recent_files[days,extension][]
recent_files=find . -name '*.PARAM2' -mtime -PARAM1 -type f 2>/dev/null | wc -l | tr -d ' '

# TODO/FIXME count in specific extension
# Usage: ][todo_count[keyword,extension][]
todo_count=grep -r 'PARAM1' --include='*.PARAM2' . 2>/dev/null | wc -l | tr -d ' ' || echo '0'

# Git log for specific file
# Usage: ][file_commits[filepath,count][]
file_commits=git log --oneline -PARAM2 -- 'PARAM1' 2>/dev/null | head -PARAM2

# Dependency check (looks for require/import statements)
# Usage: ][dependency_usage[module_name,extension][]
dependency_usage=grep -rE "(require|import).*PARAM1" --include='*.PARAM2' . 2>/dev/null | wc -l | tr -d ' ' || echo '0'

[meta_keywords]
# Information about the template processing itself
# Most of these are handled internally by the processor

# Processing metadata
generation_date=date '+%Y-%m-%d %H:%M:%S'
kml_version=echo '1.0'

# Computed at runtime by processor (not bash commands)
# template_name - Source template filename (internal)
# ticket_id - Generated ticket identifier (internal)
# processing_time - Time taken to process template (internal)

[custom_keywords]
# Project-specific custom keywords can be added here
# These override any keywords with the same name in other sections

# Example: custom project greeting
# project_greeting=echo "Welcome to $(basename $(pwd))!"

# Example: count specific pattern in project
# my_pattern_count=grep -r 'MyPattern' ./src 2>/dev/null | wc -l
