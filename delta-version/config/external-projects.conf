# Delta-Version External Projects Configuration
# File: config/external-projects.conf
#
# This configuration file allows Delta-Version to discover and manage projects
# located outside the main repository directory structure.
#
# Created as part of Issue 024: External Project Directory Configuration

[external_directories]
# Format: symbolic_name=absolute_path
# Each entry defines an additional directory to search for projects
#
# Example entries (uncomment and modify as needed):
# personal_dev=/home/ritz/personal-development
# work_projects=/opt/company/projects
# archived_code=/mnt/storage/archived-projects

# Example: Home programming directory
# home_programming=/home/ritz/programming

[settings]
# Global settings for external project handling
# include_in_default_listings: Include external projects when listing without --exclude-external
# validate_paths_on_load: Check if external directories exist when loading configuration
# cache_external_discoveries: Cache external project discovery results
# cache_duration_minutes: How long to keep cached discoveries

include_in_default_listings=true
validate_paths_on_load=true
cache_external_discoveries=false
cache_duration_minutes=30

[path_validation]
# Path validation rules for security and correctness
# require_absolute_paths: Only accept absolute paths in configuration
# forbid_network_paths: Reject network/remote paths (//server or smb://)
# check_read_permissions: Verify read access before accepting directory
# warn_on_missing_directories: Print warning for configured but missing directories

require_absolute_paths=true
forbid_network_paths=true
check_read_permissions=true
warn_on_missing_directories=true

[integration]
# Integration with other Delta-Version systems
# include_in_gitignore_analysis: Include external projects in gitignore scanning
# include_in_ticket_distribution: Include external projects in ticket distribution
# include_in_branch_management: Include external projects in git branch operations

include_in_gitignore_analysis=true
include_in_ticket_distribution=true
include_in_branch_management=false
