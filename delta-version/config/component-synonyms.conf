# component-synonyms.conf - names todone.lua treats as one component (issue 053b, tier 2).
#
# One line per component: the name to report = other names for it.
# Case, spaces, "-" and "_" are ignored already (ThreadPool = thread-pool),
# so list only genuinely different words. Add to this as overlaps turn up.

threadpool = worker pool, job queue, task pool
tui framework = terminal ui, text user interface, tui library
llm client = chat client, inference client, llama client, ollama client
json parser = json library, json reader
config parser = configuration parser, ini parser, settings parser
