# shared-components.conf - what todone-roadmap.lua knows about each shared
# component beyond what todone.lua finds (issue 053c).
#
# One fact per line, any number of lines per component:
#   NAME: needs A, B             build A and B before NAME
#   NAME: complexity high        low (5 h), medium (20 h), high (50 h), very high (100 h)
#   NAME: home PATH              where the shared library would live
# Names match todone's the same way todone matches them: case, spaces, "-"
# and "_" are ignored, and config/component-synonyms.conf applies. A
# component with no complexity line is taken as medium, and the roadmap
# marks it as a guess.
#
# Examples (remove the leading "# " to use one):
# llm client: needs http client
# threadpool: complexity high
# tui framework: home libs/lua/tui
